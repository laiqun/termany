name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Build web frontend
        run: npm run build:web

      - name: Bundle the Node server (node.exe + node-pty + server.cjs)
        run: npm run bundle:server

      # No tagName => tauri-action only builds (no GitHub release), so this
      # never races the macOS release workflow. The installer is uploaded as a
      # downloadable artifact below.
      - name: Build the app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri --
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: termany-windows-x64-setup
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
